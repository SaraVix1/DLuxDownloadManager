# git-cliff (https://git-cliff.org): CHANGELOG.md and release notes from conventional commits.
#   git-cliff --tag v0.2.0 -o CHANGELOG.md     # before tagging a release

[changelog]
header = """
# Changelog

All notable changes to dlux. The format follows [Keep a Changelog](https://keepachangelog.com/),
and dlux uses [Semantic Versioning](https://semver.org/).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^(build|ci)", group = "<!-- 5 -->Build and CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|style|test)", group = "<!-- 6 -->Other" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
