[workspace]
resolver = "3"
members = ["crates/dlux-core", "crates/dlux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["dlux contributors"]
repository = "https://github.com/SaraVix1/DLuxDownloadManager"
homepage = "https://github.com/SaraVix1/DLuxDownloadManager"
keywords = ["aria2", "download-manager", "tui", "yt-dlp", "torrent"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
