name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Build (fails on Svelte warnings)
        run: |
          npm --prefix web run build 2>&1 | tee build.log
          if grep -q "svelte.dev/e/" build.log; then echo "::error::Svelte warnings (see above)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/dlux/web-dist
          retention-days: 7

  lint-test:
    name: fmt, clippy, test (Linux)
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/dlux/web-dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Integration tests drive a real aria2 (they are skipped without it).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends aria2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: bash .github/scripts/test.sh

  windows:
    name: build, test (Windows)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/dlux/web-dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - name: cargo test
        shell: bash
        run: bash .github/scripts/test.sh

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # Without web-dist the fallback page is embedded, which is fine for a compile check.
      - run: cargo check --locked --all-targets
