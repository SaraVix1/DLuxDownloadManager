version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    ignore:
      # The MSRV job pins the oldest supported Rust on purpose (`@1.88` is a toolchain, not a tag).
      - dependency-name: dtolnay/rust-toolchain
