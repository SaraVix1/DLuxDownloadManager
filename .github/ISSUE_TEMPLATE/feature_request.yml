name: Feature request
description: An idea to make dlux better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could dlux help?
      description: In the TUI, the web UI, or both? Mouse and keyboard?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
