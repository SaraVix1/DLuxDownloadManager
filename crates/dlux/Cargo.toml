[package]
name = "dlux"
description = "Download everything. Beautifully. A modern aria2 download manager with a mouse-driven TUI and a web UI."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "dlux"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dlux-core = { version = "0.1.0", path = "../dlux-core" }
futures-util = { version = "0.3.34", default-features = false }
ratatui = "0.30"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path", "mime-guess", "debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
url = "2.5.8"

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
